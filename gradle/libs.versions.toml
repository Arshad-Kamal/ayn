# KT-SEC-03: all dependency versions live here, nothing hardcoded in module scripts.

[versions]
agp = "9.4.1"
kotlin = "2.4.20"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
tvMaterial = "1.1.0"
navigationCompose = "2.10.2"
# M6-D3: the mobile UI's navigation (stable line, checked 2026-10-10).
navigation3 = "1.2.0"
media3 = "1.11.1"
coroutines = "1.11.0"
serialization = "1.11.0"
# Room 3 + KSP. KSP dropped the Kotlin-version prefix at 2.3.0; 2.3.10+
# carries the AGP-9 built-in-Kotlin fixes.
ksp = "2.3.12"
room3 = "3.0.3"
# D3: Coil 3 image pipeline (Apache-2.0). coil-network-okhttp reuses the OkHttp
# transport line; its fetcher self-registers via ServiceLoader (no manual ImageLoader setup).
coil = "3.6.3"
robolectric = "4.17" # JVM Android tests (SDK pinned in @Config)
# Vendored NewPipeExtractor dependency pins (THIRD-PARTY.md entry 1; taken from upstream's
# own libs.versions.toml — do not drift silently).
jsr305 = "3.0.2"
jsoup = "1.23.1"
protobuf = "4.35.1"
protobufPlugin = "0.10.0"
rhino = "1.8.1" # upstream pins 1.8.1 (rhino 1.9.0 raises minSdk concerns, upstream #1423)
nanojson = "e9d656ddb49a412a5a0a5d5ef20ca7ef09549996" # com.github.TeamNewPipe:nanojson @ commit (jitpack)
# App-owned HTTP client (extraction transport, BotGuard, SABR, Coil); not an extractor dependency.
okhttp = "5.5.0"
# KP-D7: owner-only title patterns in linear time (Go-style licence, GPL-3.0-compatible).
re2j = "1.8"
# Q20 (M8.7c): the TV's sign-in QR codes (MIT, no dependencies).
qrcodegen = "1.8.0"
junit4 = "4.13.2"
testCore = "1.7.0"
testRunner = "1.7.0"
testExtJunit = "1.3.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "tvMaterial" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
# M6 (:ui:mobile): Material 3 + its navigation suite via the Compose BOM; Navigation3 + its ViewModel scoping.
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material3-adaptive-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite" }
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
# media3 / coroutines / serialization: pinned for M3/M5 (KT-SEC-03), wired when first used.
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
# LIVE-D11: live streams play from YouTube's HLS manifest, fetched through the app's OkHttp client.
androidx-media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
androidx-media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }
androidx-media3-ui-compose = { group = "androidx.media3", name = "media3-ui-compose", version.ref = "media3" }
androidx-room3-runtime = { group = "androidx.room3", name = "room3-runtime", version.ref = "room3" }
androidx-room3-compiler = { group = "androidx.room3", name = "room3-compiler", version.ref = "room3" }
androidx-room3-testing = { group = "androidx.room3", name = "room3-testing", version.ref = "room3" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "serialization" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
# Vendored extractor deps (THIRD-PARTY.md entry 1).
google-jsr305 = { group = "com.google.code.findbugs", name = "jsr305", version.ref = "jsr305" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
google-protobuf-javalite = { group = "com.google.protobuf", name = "protobuf-javalite", version.ref = "protobuf" }
mozilla-rhino = { group = "org.mozilla", name = "rhino", version.ref = "rhino" }
mozilla-rhino-engine = { group = "org.mozilla", name = "rhino-engine", version.ref = "rhino" }
newpipe-nanojson = { group = "com.github.TeamNewPipe", name = "nanojson", version.ref = "nanojson" }
squareup-okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
# M8-D10: cloud-sync clients replay their recorded exchanges (test scope only).
squareup-mockwebserver3 = { group = "com.squareup.okhttp3", name = "mockwebserver3", version.ref = "okhttp" }
nayuki-qrcodegen = { group = "io.nayuki", name = "qrcodegen", version.ref = "qrcodegen" }
google-re2j = { group = "com.google.re2j", name = "re2j", version.ref = "re2j" }
# Coil 3 (D3): thumbnails sized to UI resolution (TVU-3); Apache-2.0, GPL-3.0-compatible.
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "testCore" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "testRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "testExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# NOTE (AGP 9 built-in Kotlin): org.jetbrains.kotlin.android is deliberately NOT declared.
# KGP version is forced via the root buildscript classpath (see build.gradle.kts).
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidx-room3 = { id = "androidx.room3", version.ref = "room3" }
