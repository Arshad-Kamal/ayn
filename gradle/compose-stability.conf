// Compose stability configuration (spec M4 D5, CMP-8/CMP-STABLE-02 declared fix).
// The globs mark the val-only model packages stable — the intended members are the data
// classes that appear as composable parameters, which then skip on `equals` instead of
// identity. The rest of each package is swept too: classes without an `equals` (ViewModels,
// state holders, exceptions) keep identity equality, so under strong skipping the mark changes
// nothing for them. A data class listed here keeps every observable value in its `equals`.
// The `newpipe` adapter subpackage is deliberately NOT listed. `:feature` and `:core` have no
// Compose compiler, so their types are unstable unless listed (PERF E9).
