# Build-ops per coding-standards KT-BUILD-01/02/03: named execution strategy, bounded
# daemon heaps (Gradle + Kotlin daemons must not each claim the machine), loud fallback failure.

org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xmx2048m
kotlin.daemon.useFallbackStrategy=false

android.useAndroidX=true
android.nonTransitiveRClass=true
